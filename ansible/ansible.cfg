[defaults]
inventory = inventory/hosts.ini
host_key_checking = False
deprecation_warnings = False
command_warnings = False
retry_files_enabled = False
stdout_callback = yaml
roles_path = roles
timeout = 30

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
