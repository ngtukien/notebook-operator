- name: Ensure curl is installed
  ansible.builtin.apt:
    name: curl
    state: present
    update_cache: true

- name: Ensure K3s config directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - /etc/rancher/k3s
    - /var/lib/rancher/k3s/agent/etc/containerd

- name: Configure K3s kubelet-arg for DynamicResourceAllocation
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    content: |
      kubelet-arg:
        - "feature-gates=DynamicResourceAllocation=true"
    mode: '0644'

- name: Configure containerd to enable CDI
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/agent/etc/containerd/config.toml.tmpl
    content: |
      [plugins."io.containerd.grpc.v1.cri"]
        enable_cdi = true
    mode: '0644'

- name: Install K3s Server (v1.36.2+k3s1)
  ansible.builtin.shell: |
    set -o pipefail
    curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION=v1.36.2+k3s1 sh -s - server --write-kubeconfig-mode=644
  args:
    creates: /usr/local/bin/k3s
    executable: /bin/bash

- name: Khởi động K3s Server lần đầu
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for K3s Master node to be ready
  ansible.builtin.command: kubectl get nodes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: nodes_result
  until: nodes_result.rc == 0
  retries: 5
  delay: 5
  changed_when: false

- name: Sao chép kubeconfig và thay localhost/127.0.0.1 bằng IP thực
  ansible.builtin.shell: |
    set -o pipefail
    mkdir -p ~/.kube
    sed -e 's|https://127.0.0.1|https://{{ ansible_host }}|g' \
        -e 's|https://localhost|https://{{ ansible_host }}|g' \
        /etc/rancher/k3s/k3s.yaml > ~/.kube/config
    chmod 600 ~/.kube/config
  args:
    executable: /bin/bash
  changed_when: false

- name: Tải kubeconfig về máy local
  ansible.builtin.fetch:
    src: ~/.kube/config
    dest: "~/k3s.yaml"
    flat: true

- name: Get K3s token for worker nodes
  ansible.builtin.command: cat /var/lib/rancher/k3s/server/node-token
  register: k3s_token
  changed_when: false
