- name: Uninstall legacy NVIDIA Official Device Plugin (if any)
  ansible.builtin.shell: |
    set -o pipefail
    helm uninstall nvdp -n nvidia-device-plugin || true
    kubectl delete ns nvidia-device-plugin --ignore-not-found
    kubectl delete ds nvidia-device-plugin-daemonset -n kube-system --ignore-not-found
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  failed_when: false
  changed_when: false

- name: Label all K3s nodes to enable HAMi scheduling
  ansible.builtin.shell: |
    for node in $(kubectl get nodes -o jsonpath='{.items[*].metadata.name}'); do
      kubectl label node $node gpu=on --overwrite
    done
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Create RuntimeClass nvidia
  ansible.builtin.shell: |
    set -o pipefail
    cat <<'EOF' | kubectl apply -f -
    apiVersion: node.k8s.io/v1
    kind: RuntimeClass
    metadata:
      name: nvidia
    handler: nvidia
    EOF
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

# HAMi Device Plugin: Triển khai HAMi qua Helm Chart (mode device-plugin thuần).
# HAMi scheduler + device plugin sẽ:
#   - Expose nvidia.com/gpu, nvidia.com/gpumem, nvidia.com/gpucores extended resources
#   - Inject libvgpu.so vào container để giới hạn VRAM/Compute
# Không cần cert-manager hay DRA webhook.
- name: Add HAMi Helm repository
  ansible.builtin.shell: |
    helm repo add hami-charts https://project-hami.github.io/HAMi/
    helm repo update
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Install HAMi Device Plugin via Helm
  ansible.builtin.shell: |
    helm upgrade --install hami hami-charts/hami \
      -n hami-system \
      --create-namespace \
      --set scheduler.kubeScheduler.enabled=false \
      --set devicePlugin.runtimeClassName=nvidia
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  changed_when: false

- name: Wait for HAMi device plugin to be ready
  ansible.builtin.shell: |
    set -o pipefail
    kubectl rollout status daemonset -n hami-system -l app.kubernetes.io/instance=hami --timeout=120s 2>/dev/null || true
    kubectl get pods -n hami-system --no-headers 2>/dev/null
  args:
    executable: /bin/bash
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  register: hami_result
  retries: 3
  delay: 10
  until: hami_result.rc == 0
  changed_when: false
