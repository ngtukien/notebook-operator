[master]
# ==========================================
# Trường hợp 1: Single-node chạy trực tiếp (Local)
# ==========================================
localhost ansible_connection=local

# ==========================================
# Trường hợp 2: SSH tới Multi-node (Remote)
# (Comment dòng localhost ở trên và uncomment các dòng dưới)
# ==========================================
# master ansible_host=192.168.123.27 ansible_user=ngtukien

[worker]
# worker ansible_host=192.168.123.187 ansible_user=ngtukien
# worker-2 ansible_host=192.168.1.202 ansible_user=ubuntu

[k3s_cluster:children]
master
worker

[k3s_cluster:vars]
# Thêm các biến chung ở đây nếu cần (vd: mật khẩu ssh, key path)
# ansible_ssh_private_key_file=~/.ssh/id_ed25519
