name: DevSecOps Pipeline (Trivy)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  trivy-security-scan:
    name: Trivy Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Bước 1: Quét lỗi cấu hình (Misconfigurations) trong Kubernetes Manifests
      - name: Quét cấu hình Manifest (IaC)
        id: scan-iac
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'config'
          scan-ref: 'config/'
          trivy-ignores-config: '.trivyignore'
          format: 'table'
          output: 'trivy-iac-report.txt'
          exit-code: '1'      # Cảnh báo: Sẽ đánh trượt Pipeline nếu phát hiện lỗi ở các file yaml
          severity: 'CRITICAL,HIGH'

      # Bước 2: Build Docker Image (Ví dụ với bản HuggingFace)
      - name: Build Docker Image (HuggingFace)
        if: always()
        run: |
          docker build -t ghcr.io/ngtukien/jupiter-container:huggingface -f images/Dockerfile.container-huggingface images/

      # Bước 3: Quét lỗ hổng phần mềm (CVEs) trong thư viện của Docker Image
      - name: Quét lỗ hổng Image (CVEs)
        id: scan-image
        if: always()
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/ngtukien/jupiter-container:huggingface'
          trivy-ignores-config: '.trivyignore'
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '1'      # Bắt buộc sập Pipeline (Failed) nếu phát hiện lỗi CRITICAL/HIGH trong thư viện
          severity: 'CRITICAL,HIGH'

      # Bước 4: Tạo GitHub Step Summary và Báo cáo kết quả
      - name: Báo cáo kết quả quét (GitHub Step Summary)
        if: always()
        run: |
          echo "## 🛡️ Trivy Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f trivy-iac-report.txt ]; then
            echo "### 📄 1. Kubernetes Manifests (IaC) Scan" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat trivy-iac-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f trivy-image-report.txt ]; then
            echo "### 🐳 2. Container Image (CVEs) Scan" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat trivy-image-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ steps.scan-iac.outcome }}" = "failure" ] || [ "${{ steps.scan-image.outcome }}" = "failure" ]; then
            echo "❌ **Trivy Scan phát hiện lỗ hổng mức HIGH/CRITICAL! Vui lòng kiểm tra lại báo cáo trên.**" >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "✅ **Trivy Scan hoàn tất: Không phát hiện lỗ hổng mức HIGH/CRITICAL.**" >> $GITHUB_STEP_SUMMARY
          fi
