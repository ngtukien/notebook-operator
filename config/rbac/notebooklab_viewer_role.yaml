apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: notebook-operator
    app.kubernetes.io/managed-by: kustomize
  name: notebooklab-viewer-role
rules:
- apiGroups:
  - lab.ngtukien.id.vn
  resources:
  - notebooklabs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - lab.ngtukien.id.vn
  resources:
  - notebooklabs/status
  verbs:
  - get
