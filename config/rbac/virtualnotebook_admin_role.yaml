# This rule is not used by the project notebook-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over lab.ngtukien.id.vn.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: notebook-operator
    app.kubernetes.io/managed-by: kustomize
  name: virtualnotebook-admin-role
rules:
- apiGroups:
  - lab.ngtukien.id.vn
  resources:
  - virtualnotebooks
  verbs:
  - '*'
- apiGroups:
  - lab.ngtukien.id.vn
  resources:
  - virtualnotebooks/status
  verbs:
  - get
