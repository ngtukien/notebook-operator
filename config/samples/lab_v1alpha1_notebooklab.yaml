apiVersion: lab.ngtukien.id.vn/v1alpha1
kind: NotebookLab
metadata:
  name: my-notebook
  namespace: default
  labels:
    app: my-notebook
    user: ngtukien
spec:
  image: ghcr.io/ngtukien/notebook-operator/base-image:latest

  # --- Compute Resources ---
  resources:
    requests:
      cpu: "2"
      memory: 4Gi
    limits:
      cpu: "4"
      memory: 8Gi

  # --- GPU (Device Plugin) ---
  # type: "hami" → HAMi vGPU sharing (nvidia.com/gpu + gpumem + gpucores)
  # type: "mig"  → NVIDIA MIG partitions (nvidia.com/mig-<profile>)
  gpu:
    enable: true
    type: hami
    hami:
      cores: 50    # 50% GPU cores
      memory: 3Gi  # 3Gi VRAM
    # mig:
    #   profile: "1g.5gb"  # Uncomment cho MIG mode

  # --- Storage ---
  storage:
    workspace:
      size: 10Gi
      storageClassName: local-path   # StorageClass mặc định của K3s
      mountPath: /workspace
    tmp:
      sizeLimit: 2Gi
      mountPath: /tmp

  # --- Lifecycle Policies ---
  lifecycle:
    idleTimeoutMinutes: 60      # Tự pause sau 60 phút idle
    maxLifespanHours: 8         # Tự pause sau 8 giờ chạy liên tục
    purgeAfterInactiveDays: 7   # Xóa hoàn toàn sau 7 ngày không dùng

  # --- Scheduling ---
  nodeSelector:
    gpu: "on"   # Label được HAMi ansible role gán cho node
